name: Build macOS App

on:
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Mostrar arquivos
        run: |
          pwd
          ls -la

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pdfplumber

      - name: Gerar aplicativo macOS
        run: |
          python -m PyInstaller --windowed --name "PDF Extractor" pdf_extractor_gui.py

      - name: Compactar app
        run: |
          cd dist
          zip -r "PDF-Extractor-macOS.zip" "PDF Extractor.app"

      - name: Enviar artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Extractor-macOS
          path: dist/PDF-Extractor-macOS.zip
